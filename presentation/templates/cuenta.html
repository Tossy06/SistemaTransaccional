{% extends "base.html" %}{% block titulo %}Mi cuenta{% endblock %}
{% block contenido %}
<div class="cabecera">
  <div>
    <h1>Mi cuenta</h1>
    <dl class="datos">
      <div><dt>Nombre</dt><dd>{{ usuario.nombre }}</dd></div>
      <div><dt>Correo</dt><dd>{{ usuario.email }}</dd></div>
      <div><dt>Documento</dt><dd class="cifra">{{ usuario.documento }}</dd></div>
      <div><dt>Roles</dt><dd>{{ usuario.roles|roles_texto }}</dd></div>
    </dl>
  </div>
</div>
<section class="mesa" style="max-width:560px">
  <h2>Cambiar contraseña</h2>
  <form method="post" action="/cuenta/password" class="pila">{{ csrf_field }}
    <label>Contraseña actual <input type="password" name="actual" required autocomplete="current-password"></label>
    <label>Contraseña nueva <span class="ayuda">Mínimo 8 caracteres, con letras y números</span><input type="password" name="nueva" required minlength="8" maxlength="128" autocomplete="new-password" pattern="(?=.*[A-Za-z])(?=.*\d).{8,}" data-mensaje="Use 8 caracteres o más, con letras y números."></label>
    <label>Repita la contraseña nueva <input type="password" name="confirmacion" required maxlength="128" autocomplete="new-password" data-igual-a="nueva"></label>
    <div><button>Cambiar contraseña</button></div>
  </form>
</section>
{% endblock %}
